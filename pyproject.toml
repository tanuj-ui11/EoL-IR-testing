[project]
name = "ir-test"
version = "0.1.0"
description = "End-of-line insulation / dielectric withstand test station for chargers (CC2670P hipot)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
ir-test = "ir_test.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ir_test = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
